  figshare_base_url: "https://ndownloader.figshare.com/files/"
  data_dir: "data/raw"
  # Annotated archives (smaller, prioritized for analysis)
  annotated_archives:
    - file_id: 56279351
      name: "916hz_sampling.7z"
      size_kb: 5.8
    - file_id: 56279357
      name: "4000hz_sampling.7z"
      size_kb: 35.8
    - file_id: 56279360
      name: "2400hz_sampling.7z"
      size_kb: 1510
    - file_id: 56279363
      name: "2100hz_sampling.7z"
      size_kb: 24.7
    - file_id: 56279369
      name: "2000hz_sampling.7z"
      size_kb: 329
    - file_id: 56279366
      name: "600hz_sampling.7z"
      size_kb: 6070
    - file_id: 56279372
      name: "4800hz_sampling.7z"
      size_kb: 5660
    - file_id: 56279375
      name: "800hz_sampling.7z"
      size_kb: 584
  # Large unlabeled archives (optional)
  unlabeled_archives:
    - file_id: 56314379
