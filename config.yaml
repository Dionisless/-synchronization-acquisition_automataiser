      size_gb: 2.57
    - file_id: 56314376
      name: "unlabeled_50_1200.7z"
      size_gb: 2.26

closing_detector:
  # Threshold for current detection (fraction of file maximum)
  current_threshold_fraction: 0.05
  # Absolute fallback threshold (amperes, primary side)
  current_threshold_abs_a: 10.0
  # Number of samples current must stay above threshold (anti-noise)
  min_sustain_samples: 3
  # Maximum plausible closing time (ms) - anything above is "stuck breaker"
  max_closing_time_ms: 350.0
  # Minimum plausible closing time (ms) - below is likely noise
  min_closing_time_ms: 10.0
  # Window before close command to search for pre-command signals (ms)
  pre_command_window_ms: 10.0
  # Window after close command to search for current (ms)
  search_window_ms: 500.0
  # Channel name patterns (case-insensitive regex)
  close_command_patterns:
    - "clos"
    - "kv"
    - "кв"
    - "52c"
    - "vcmd"
    - "cmd"
    - "comm"
    - "на вкл"
    - "вкл"
  breaker_position_patterns:
    - "52a"
    - "52b"
    - "pv"
    - "пв"
    - "posit"
    - "положен"
  current_channel_patterns:
    - "^i[abc]$"
    - "^i[abc]_"
    - "^ia$|^ib$|^ic$"
    - "ток"
    - "current"
  current_channel_units:
    - "a"
    - "ka"
    - "ma"

outlier_detection:
  # IQR multiplier for outlier detection
  iqr_multiplier: 2.0
  # Minimum samples before outlier detection activates
  min_samples_for_detection: 5
  # Maximum fraction of outliers allowed in a window
  max_outlier_fraction: 0.3

models:
  # Rolling median window
  median_window: 10
  # EWMA smoothing factor (0 < alpha < 1, higher = more responsive)
  ewma_alpha: 0.25
  # Kalman filter parameters
  kalman:
    # Process noise std for closing time state (ms per operation)
    process_noise_time_ms: 0.3
    # Process noise std for drift state (ms per operation)
    process_noise_drift_ms: 0.05
    # Measurement noise std (ms) - reflects detection algorithm uncertainty
    measurement_noise_ms: 2.0
    # Initial state uncertainty (ms)
    initial_uncertainty_ms: 10.0
  # Theil-Sen regression window (number of recent observations)
  regression_window: 20

evaluation:
  # Train/test split ratio
  train_fraction: 0.7
  # Minimum number of operations per CB for evaluation
  min_operations: 10
  # Random seed for reproducibility
  random_seed: 42
